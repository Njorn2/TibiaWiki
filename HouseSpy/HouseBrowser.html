<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HouseSpy — todas as casas</title>
</head>
<body>
<div class="house-browser">
    <form class="house-browser-filters" action="#" role="search">
        <label>Cidade
            <select class="house-browser-city">
                <option value="">Todas as cidades</option>
            </select>
        </label>
        <label>Tipo
            <select class="house-browser-kind">
                <option value="">Casas e guildhalls</option>
                <option value="house">Casas</option>
                <option value="guildhall">Guildhalls</option>
            </select>
        </label>
        <label>Nome
            <input class="house-browser-query" type="search" placeholder="Filtrar pelo nome" autocomplete="off">
        </label>
        <p class="house-browser-count">Carregando casas…</p>
    </form>
    <div class="house-browser-list" role="list" aria-label="Casas"></div>
    <div class="house-browser-main">
        <div class="house-browser-stage">
<div
    class="house-spy"
    data-browse="true"
    data-house=""
    data-width="100%"
    data-height="640"
    role="region"
    aria-label="Visualizador de casa">
    <div class="house-spy-bar">
        <p class="house-spy-name">Casa</p>
        <p class="house-spy-meta">
            <span class="house-spy-floor" aria-live="polite">Escolha uma casa</span>
        </p>
        <div class="house-spy-controls">
            <button type="button" class="house-spy-up">Subir</button>
            <button type="button" class="house-spy-down">Descer</button>
            <div class="house-spy-zoom-group" role="group" aria-label="Zoom">
                <button type="button" class="house-spy-zoom-out" aria-label="Diminuir zoom">−</button>
                <span class="house-spy-zoom">100%</span>
                <button type="button" class="house-spy-zoom-in" aria-label="Aumentar zoom">+</button>
                <button type="button" class="house-spy-fit">Ajustar</button>
            </div>
        </div>
    </div>
    <p class="house-spy-hint">Arraste a planta para mover. A roda do mouse ou os botões ampliam e reduzem.</p>
    <div class="house-spy-stage" tabindex="0" aria-label="Planta da casa. Arraste para mover.">
        <div class="house-spy-canvas"></div>
        <div class="house-spy-status" role="status"></div>
    </div>
    <div class="house-spy-floors" role="tablist" aria-label="Andares" hidden></div>
</div>
        </div>
        <aside class="house-browser-panel" aria-live="polite">
            <h2>Dados da casa</h2>
            <p>Selecione uma casa para ver o preço, a cidade e a planta.</p>
        </aside>
    </div>
</div>
<style>

        box-sizing: border-box;
        color: #000000;
        font-family: Verdana, Arial, sans-serif;
        font-size: 13px;
        line-height: 1.35;
    }
    .house-browser *,
    .house-browser *::before,
    .house-browser *::after {
        box-sizing: border-box;
    }
    .house-browser-filters {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 8px 12px;
        margin: 0 0 8px;
    }
    .house-browser-filters label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-weight: bold;
    }
    .house-browser-filters select,
    .house-browser-filters input {
        min-width: 220px;
        min-height: 32px;
        padding: 4px 8px;
        border: 1px solid #a2a9b1;
        border-radius: 5px;
        background: #ffffff;
        color: #000000;
        font: inherit;
        font-weight: normal;
    }
    .house-browser-count {

    .house-browser-main {
        display: flex;

        gap: 8px;
    }
    .house-browser-list,
    .house-browser-panel {
        overflow: auto;
        border: 2px solid #a2a9b1;
        border-radius: 5px;
        background: #ffffff;
    }
    .house-browser-list {
        max-height: 220px;
        margin: 0 0 8px;
    }
    .house-browser-panel {

<script
    src="https://cdn.jsdelivr.net/npm/@umanthir/sdk@1.1.0/dist/umanthir.min.js"
    integrity="sha384-fGCgF4CT/VJAG38XkwYIDXPusa37MVw5oeZZJeZnjRoCRbQ5GeQkRdeGAHulD05Z"
    crossorigin="anonymous"></script>
<script>
    (function () {
        var MAX_SCALE = 8;
        var client = null;

        whenUmanthir(startViewers, startViewers);

        function startViewers() {
            if (!client) {
                client = createClient();
            }
            document.querySelectorAll(".house-spy").forEach(function (root) {
                if (root.getAttribute("data-ready") === "true") {
                    return;
                }
                root.setAttribute("data-ready", "true");
                mount(root);
            });
        }

        function createClient() {
            if (typeof Umanthir !== "function") {
                return null;
            }
            if (typeof window.UMANTHIR_KEY === "string" && window.UMANTHIR_KEY) {
                return new Umanthir({ apiKey: window.UMANTHIR_KEY });
            }
            return new Umanthir();
        }

        function whenUmanthir(run, fail) {
            var failSafe = fail || function () {};
            var settled = false;
            var armed = false;
            function succeed() {
                if (settled) {
                    return;
                }
                settled = true;
                run();
            }
            function giveUp() {
                if (settled) {
                    return;
                }
                settled = true;
                failSafe();
            }
            function watch() {
                if (typeof Umanthir === "function") {
                    succeed();
                    return true;
                }
                var pending = window.tibiawiki && window.tibiawiki.umanthir;
                if (!armed && pending && typeof pending.then === "function") {
                    armed = true;
                    pending.then(function () {
                        if (typeof Umanthir === "function") {
                            succeed();
                        }
                    }, giveUp);
                }
                return settled;
            }
            if (watch()) {
                return;
            }
            var tries = 0;
            var timer = setInterval(function () {
                tries += 1;
                if (watch() || settled) {
                    clearInterval(timer);
                    return;
                }
                if (tries >= 50) {
                    clearInterval(timer);
                    giveUp();
                }
            }, 100);
            if (window.mw && mw.loader && typeof mw.loader.using === "function") {
                mw.loader.using("site").then(watch, function () {});
            }
        }

        function mount(root) {
            var nameNode = root.querySelector(".house-spy-name");
            var floorNode = root.querySelector(".house-spy-floor");
            var upButton = root.querySelector(".house-spy-up");
            var downButton = root.querySelector(".house-spy-down");
            var zoomOutButton = root.querySelector(".house-spy-zoom-out");
            var zoomInButton = root.querySelector(".house-spy-zoom-in");
            var zoomNode = root.querySelector(".house-spy-zoom");
            var fitButton = root.querySelector(".house-spy-fit");
            var stage = root.querySelector(".house-spy-stage");
            var canvas = root.querySelector(".house-spy-canvas");
            var status = root.querySelector(".house-spy-status");
            var floorsNode = root.querySelector(".house-spy-floors");
            var state = {
                slug: "",
                name: "Casa",
                floors: [],
                index: 0,
                surface: 7,
                ground: 7,
                step: { x: 32, y: 32 },
                sizes: {},
                urls: {},
                pending: {},
                scale: 1,
                panX: 0,
                panY: 0,
                moved: false,
                fitted: false,
                token: 0,
                drag: null
            };

            applySize(root);
            upButton.addEventListener("click", function () {
                stepFloor(-1);
            });
            downButton.addEventListener("click", function () {
                stepFloor(1);
            });
            zoomOutButton.addEventListener("click", function () {
                zoomBy(1 / 1.25);
            });
            zoomInButton.addEventListener("click", function () {
                zoomBy(1.25);
            });
            fitButton.addEventListener("click", function () {
                state.moved = false;
                fit();
            });
            stage.addEventListener("pointerdown", onPointerDown);
            stage.addEventListener("pointermove", onPointerMove);
            stage.addEventListener("pointerup", endDrag);
            stage.addEventListener("pointercancel", endDrag);
            stage.addEventListener("wheel", onWheel, { passive: false });
            stage.addEventListener("dblclick", function (event) {
                event.preventDefault();
                if (state.moved) {
                    state.moved = false;
                    fit();
                    return;
                }
                zoomAt(event.clientX, event.clientY, 2);
            });
            root.addEventListener("keydown", onKeyDown);
            if (typeof ResizeObserver === "function") {
                var observer = new ResizeObserver(function () {
                    if (!state.moved) {
                        fit();
                    }
                });
                observer.observe(stage);
            }
            root.addEventListener("housespy:open", function (event) {
                var slug = event.detail && typeof event.detail.slug === "string"
                    ? event.detail.slug.trim()
                    : "";
                if (!slug || slug === state.slug) {
                    return;
                }
                root.setAttribute("data-house", slug);
                loadHouse();
            });
            loadHouse();

            function loadHouse() {
                state.token += 1;
                var token = state.token;
                state.slug = resolveSlug(root);
                state.floors = [];
                state.ground = 7;
                state.fitted = false;
                state.moved = false;
                canvas.replaceChildren();
                floorsNode.replaceChildren();
                floorsNode.hidden = true;
                upButton.hidden = true;
                downButton.hidden = true;
                setBusy(true);
                if (!state.slug) {
                    if (root.getAttribute("data-browse") === "true") {
                        setBusy(false);
                        hideStatus();
                        nameNode.textContent = "Casa";
                        floorNode.textContent = "Escolha uma casa";
                        return;
                    }
                    showError("Informe a casa em data-house, ou abra o visualizador na página da casa.");
                    return;
                }
                if (!client) {
                    showError("Não foi possível carregar o SDK do Umanthir.");
                    return;
                }
                showStatus("Carregando a casa…", true);
                client.wiki.house(state.slug).then(function (assembly) {
                    if (token !== state.token) {
                        return;
                    }
                    var floors = readFloors(assembly);
                    root.dispatchEvent(new CustomEvent("housespy:loaded", {
                        bubbles: true,
                        detail: {
                            slug: state.slug,
                            assembly: assembly
                        }
                    }));
                    if (floors.length === 0) {
                        showError("Esta casa não tem andares publicados.");
                        return;
                    }
                    state.floors = floors;
                    state.name = readName(assembly, state.slug);
                    state.surface = readSurface(assembly);
                    state.ground = readGround(assembly);
                    state.step = readStep(assembly);
                    state.index = indexOfFloor(floors, initialFloor(root, floors, assembly));
                    nameNode.textContent = state.name;
                    renderFloorButtons();
                    showFloor(state.index, token);
                    floors.forEach(function (floor) {
                        if (floor.z !== state.floors[state.index].z) {
                            floorUrl(floor.z).catch(function () {});
                        }
                    });
                }).catch(function (error) {
                    if (token !== state.token) {
                        return;
                    }
                    showLoadError(error);
                });
            }

            function showFloor(index) {
                var floor = state.floors[index];
                if (!floor) {
                    return;
                }
                var slug = state.slug;
                state.index = index;
                var token = ++state.token;
                updateChrome();
                if (!state.urls[cacheKey(floor.z)]) {
                    showStatus("Carregando andar…", true);
                }
                revealFloor(floor, slug, token, true);
                stackedFloors().slice(1).forEach(function (below) {
                    revealFloor(below, slug, token, false);
                });
            }

            function revealFloor(floor, slug, token, primary) {
                floorUrl(floor.z).then(function (url) {
                    if (token !== state.token || slug !== state.slug) {
                        return;
                    }
                    var probe = new Image();
                    probe.onload = function () {
                        if (token !== state.token || slug !== state.slug) {
                            return;
                        }
                        state.sizes[cacheKey(floor.z)] = {
                            width: probe.naturalWidth,
                            height: probe.naturalHeight
                        };
                        syncLayers();
                        if (primary) {
                            if (!state.fitted) {
                                fit();
                            } else {
                                render();
                            }
                            hideStatus();
                            updateChrome();
                            return;
                        }
                        if (!state.moved) {
                            fit();
                        } else {
                            render();
                        }
                    };
                    probe.onerror = function () {
                        if (token !== state.token || !primary) {
                            return;
                        }
                        showError("Não foi possível ler a imagem deste andar.");
                    };
                    probe.src = url;
                }).catch(function (error) {
                    if (token !== state.token || slug !== state.slug || !primary) {
                        return;
                    }
                    showLoadError(error);
                });
            }

            function stackedFloors() {
                var stack = state.floors.slice(state.index);
                var limit = stack.length;
                var i;
                for (i = 0; i < stack.length; i++) {
                    if (stack[i].z === 7) {
                        limit = i + 1;
                        break;
                    }
                }
                return stack.slice(0, limit);
            }

            function syncLayers() {
                var top = state.floors[state.index];
                var ordered = stackedFloors().reverse();
                var visible = {};
                ordered.forEach(function (floor) {
                    var key = cacheKey(floor.z);
                    var url = state.urls[key];
                    if (!url || !state.sizes[key]) {
                        return;
                    }
                    visible[floor.z] = true;
                    var layer = canvas.querySelector('img[data-z="' + floor.z + '"]');
                    if (!layer) {
                        layer = document.createElement("img");
                        layer.className = "house-spy-image";
                        layer.draggable = false;
                        layer.alt = "";
                        layer.setAttribute("data-z", String(floor.z));
                    }
                    if (layer.getAttribute("src") !== url) {
                        layer.src = url;
                    }
                    var offset = offsetFor(floor.z);
                    layer.style.left = offset.x + "px";
                    layer.style.top = offset.y + "px";
                    layer.alt = floor === top
                        ? "Planta de " + state.name + ", " + floorLabel(floor).toLowerCase()
                        : "";
                    canvas.append(layer);
                });
                Array.prototype.forEach.call(canvas.querySelectorAll("img"), function (layer) {
                    if (!visible[layer.getAttribute("data-z")]) {
                        layer.remove();
                    }
                });
            }

            function floorUrl(z) {
                var slug = state.slug;
                var key = slug + ":" + z;
                if (state.urls[key]) {
                    return Promise.resolve(state.urls[key]);
                }
                if (state.pending[key]) {
                    return state.pending[key];
                }
                state.pending[key] = client.wiki.houseFloor(slug, z).then(function (bytes) {
                    var url = URL.createObjectURL(new Blob([bytes], { type: "image/png" }));
                    if (slug === state.slug) {
                        state.urls[key] = url;
                    } else {
                        URL.revokeObjectURL(url);
                    }
                    delete state.pending[key];
                    return url;
                }, function (error) {
                    delete state.pending[key];
                    throw error;
                });
                return state.pending[key];
            }

            function cacheKey(z) {
                return state.slug + ":" + z;
            }

            function stepFloor(direction) {
                var next = state.index + direction;
                if (next < 0 || next >= state.floors.length) {
                    return;
                }
                showFloor(next);
            }

            function renderFloorButtons() {
                floorsNode.replaceChildren();
                var several = state.floors.length > 1;
                floorsNode.hidden = !several;
                upButton.hidden = !several;
                downButton.hidden = !several;
                floorButtonOrder().forEach(function (item) {
                    var button = document.createElement("button");
                    button.type = "button";
                    button.className = "house-spy-floor-button";
                    button.setAttribute("role", "tab");
                    button.dataset.index = String(item.index);
                    button.textContent = groundLabel(item.floor.z);
                    button.title = floorLabel(item.floor);
                    button.addEventListener("click", function () {
                        showFloor(item.index);
                    });
                    floorsNode.append(button);
                });
            }

            var pageLink = document.createElement("a");
            pageLink.href = wikiPageUrl(data.name);
            pageLink.target = "_blank";
            pageLink.rel = "noopener noreferrer";
            pageLink.textContent = data.name;
            title.append(pageLink);
        } else {
            title.textContent = "Casa";
        }
        var facts = document.createElement("dl");
        addFact(facts, "Preço", formatGold(data.rent));
        addFact(facts, "Cidade", data.town || "—");
        addMap(facts, data);
        addFact(facts, "Tamanho", finite(data.size) ? Number(data.size).toLocaleString("pt-BR") + " SQM" : "—");
        addFact(facts, "Camas", finite(data.beds) ? String(data.beds) : "—");
        if (data.windows !== null && data.windows !== undefined && finite(data.windows)) {
            addFact(facts, "Janelas", String(data.windows));
        }
        addFact(facts, "Andares", finite(data.floors) ? String(data.floors) : "—");
        panel.append(title, facts);
    }

    function addFact(facts, label, value) {
        var term = document.createElement("dt");
        term.textContent = label;
        var description = document.createElement("dd");
        description.textContent = value;
        facts.append(term, description);
    }

    function addMap(facts, data) {
        var term = document.createElement("dt");
        term.textContent = "Localização no mapa";
        var description = document.createElement("dd");
        var x = Number(data.x);
        var y = Number(data.y);
        var z = Number(data.z);
        if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(z)) {
            description.textContent = "—";
        } else {
            var link = document.createElement("a");
            link.href = "https://www.tibiawiki.com.br/wiki/mapa#" + x + "," + y + "," + z + ":3";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = x + ", " + y + ", " + z;
            description.append(link);
        }
        facts.append(term, description);
    }

    function finite(value) {
        return value !== null && value !== undefined && value !== "" && Number.isFinite(Number(value));
    }

    function wikiPageUrl(name) {
        var aliases = {
            "Warriors' Guildhall": "Warriors Guildhall"
        };
        var title = String(name || "").trim();
        title = aliases[title] || title;
        return "https://www.tibiawiki.com.br/wiki/" + encodeURIComponent(title.replace(/ /g, "_"));
    }

    function formatGold(value) {
        if (!finite(value)) {
            return "—";
        }
        return Number(value).toLocaleString("pt-BR") + " gp";
    }

    function showEmpty() {
        panel.replaceChildren();
        var title = document.createElement("h2");
        title.textContent = "Dados da casa";
        var message = document.createElement("p");
        message.textContent = "Selecione uma casa para ver o preço, a cidade e a planta.";
        panel.append(title, message);
    }
}());
</script>
</body>
</html>
